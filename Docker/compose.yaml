name: restdb

services:

  #
  # RestDb
  # Builds the local RestDb source tree in ../src/RestDb
  #

  restdb:
    container_name: 'restdb'
    build:
      context: ../src/RestDb
      dockerfile: Dockerfile
    ports:
      - ${RESTDB_HOST_PORT:-8000}:8000
    stdin_open: true
    tty: true
    volumes:
      - ./restdb.json:/app/restdb.json
      - ./context.json:/app/context.json
      - ./sample.db:/app/sample.db
      - ./logs/:/app/logs/
    healthcheck:
      test: curl --fail http://localhost:8000
      interval: 5s
      timeout: 2s
      retries: 2

  dashboard:
    container_name: 'restdb-dashboard'
    build:
      context: ../src/RestDb.Dashboard
      dockerfile: Dockerfile
    depends_on:
      restdb:
        condition: service_healthy
    ports:
      - ${RESTDB_DASHBOARD_HOST_PORT:-8080}:80
    healthcheck:
      test: curl --fail http://localhost
      interval: 5s
      timeout: 2s
      retries: 2

  mcp:
    container_name: 'restdb-mcp'
    build:
      context: ../src/RestDb.McpServer
      dockerfile: Dockerfile
    depends_on:
      restdb:
        condition: service_healthy
    environment:
      RESTDB_MCP_SERVER_URL: http://restdb:8000
      RESTDB_MCP_API_KEY: default
      RESTDB_MCP_API_KEY_HEADER: x-api-key
      RESTDB_MCP_HTTP_HOST: +
      RESTDB_MCP_HTTP_PORT: 8010
      RESTDB_MCP_TCP_HOST: 0.0.0.0
      RESTDB_MCP_TCP_PORT: 8011
      RESTDB_MCP_WS_HOST: +
      RESTDB_MCP_WS_PORT: 8012
    ports:
      - ${RESTDB_MCP_HTTP_HOST_PORT:-8010}:8010
      - ${RESTDB_MCP_TCP_HOST_PORT:-8011}:8011
      - ${RESTDB_MCP_WS_HOST_PORT:-8012}:8012
    healthcheck:
      test: curl --fail http://localhost:8010/
      interval: 5s
      timeout: 2s
      retries: 2
